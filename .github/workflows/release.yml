name: Release images

# Publishes ghcr.io/<owner>/loupebox-api and loupebox-web when a version tag is pushed, e.g. v0.1.0-alpha.1.
on:
  push:
    tags: ["v*"]

permissions:
  actions: read # the ci job reads the CI run for the tagged commit
  contents: write # the release job creates the GitHub Release
  packages: write

jobs:
  # A tag must not publish anything CI has not passed. The tag is normally pushed right after the merge to
  # master, so wait for that push's CI run to finish rather than failing while it is still going.
  ci:
    name: CI is green
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 40); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push \
              --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") exit 0 ;;
              "completed "*) echo "CI for $GITHUB_SHA finished as: $run" >&2; exit 1 ;;
            esac
            echo "Waiting for CI on $GITHUB_SHA (${run:-not started})"
            sleep 30
          done
          echo "CI for $GITHUB_SHA did not finish in 20 minutes" >&2
          exit 1

  images:
    name: ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {image: loupebox-api, context: ., cache: api}
          - {image: loupebox-web, context: web, cache: web}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the VERSION file
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)" || { echo "tag $GITHUB_REF_NAME != v$(cat VERSION)"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # While the project is alpha, `latest` follows the newest tag, prereleases included.
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read the layers CI cached on master (a tag can read the default branch's cache). No cache-to: a
          # cache saved from a tag ref is never read by anything else.
          cache-from: type=gha,scope=${{ matrix.cache }}

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## \[/ { on = index($0, "[" v "]") } /^\[[^]]+\]: / { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md entry for $v" >&2; exit 1; }
      # What someone needs to run the release without cloning. GitHub drops leading dots from asset names,
      # so the template is published as env.example.
      - name: Stage assets
        run: |
          mkdir dist
          cp docker-compose.yml dist/
          cp scripts/setup.sh scripts/backup.sh scripts/restore.sh dist/
          cp .env.example dist/env.example
      # --latest on purpose, not --prerelease: the install command in the README uses releases/latest/download,
      # which skips prereleases. Revisit once there is a stable 1.0.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Loupebox $GITHUB_REF_NAME" --notes-file notes.md --latest --verify-tag
