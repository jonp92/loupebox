name: Release images

# Publishes ghcr.io/<owner>/loupebox-api and loupebox-web when a version tag is pushed, e.g. v0.1.0-alpha.1.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release job creates the GitHub Release
  packages: write

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {image: loupebox-api, context: .}
          - {image: loupebox-web, context: web}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the VERSION file
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)" || { echo "tag $GITHUB_REF_NAME != v$(cat VERSION)"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # While the project is alpha, `latest` follows the newest tag, prereleases included.
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## \[/ { on = index($0, "[" v "]") } /^\[[^]]+\]: / { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md entry for $v" >&2; exit 1; }
      # What someone needs to run the release without cloning. GitHub drops leading dots from asset names,
      # so the template is published as env.example.
      - name: Stage assets
        run: |
          mkdir dist
          cp docker-compose.yml dist/
          cp scripts/setup.sh dist/setup.sh
          cp .env.example dist/env.example
      # --latest on purpose, not --prerelease: the install command in the README uses releases/latest/download,
      # which skips prereleases. Revisit once there is a stable 1.0.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Loupebox $GITHUB_REF_NAME" --notes-file notes.md --latest --verify-tag
