name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t -d t" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
        if: matrix.db == 'sqlite'
      - run: pytest -q
        if: matrix.db == 'sqlite'
      # The suite drops all tables in TEST_DATABASE_URL: this is the job's own throwaway service container.
      - run: pytest -q
        if: matrix.db == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://t:t@127.0.0.1:5432/t

  migrations:
    name: Migrations up/down/up
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t -d t" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://t:t@127.0.0.1:5432/t
      JWT_SECRET: ci-only-secret-not-used-for-anything-real-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head

  web:
    name: Web build and widget tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: zensical build --clean

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: web
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every non-merge commit needs a Signed-off-by line
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          missing=$(for c in $(git rev-list --no-merges "$RANGE"); do
            git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>' || git show -s --format='%h %s' "$c"
          done)
          if [ -n "$missing" ]; then
            printf 'Commits without Signed-off-by (use git commit -s; see CONTRIBUTING.md):\n%s\n' "$missing"
            exit 1
          fi
