target-version = "py311"
line-length = 110
extend-exclude = ["web", "migrations/versions"]

[lint]
# On top of ruff's defaults (E4, E7, E9, F): line length, likely bugs, simplifications, import order,
# and a complexity ceiling.
extend-select = ["E501", "B", "SIM", "I", "C90"]

[lint.mccabe]
# Today's worst in app/. Lower it as long functions get split, never raise it.
max-complexity = 12

[lint.per-file-ignores]
# FastAPI's Depends()/Query() in argument defaults is the framework's idiom.
"app/**" = ["B008"]
# Fixtures imported from another test module look redefined when used as arguments.
"tests/**" = ["F811"]
# A minimal SMTP server for tests: one long protocol loop reads more clearly than a split one.
"tests/fake_smtp.py" = ["C901"]
# HTML email template: inline styles inside one string, where a line break would change the markup.
"app/notifications/layout.py" = ["E501"]
