# Throwaway Postgres for benchmarks. Never point this at a real database.
#   docker compose -f bench/docker-compose.yml up -d
# Set BENCH_CPUS / BENCH_MEM to match the machine under test (defaults suit a small VM).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "127.0.0.1:${BENCH_DB_PORT:-55433}:5432"
    volumes:
      - benchdata:/var/lib/postgresql/data
    cpus: ${BENCH_CPUS:-2}
    mem_limit: ${BENCH_MEM:-4g}
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 3s
      retries: 20

volumes:
  benchdata:
