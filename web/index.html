<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- App-style: double-tap zoom is off via CSS (touch-action: manipulation). Pinch zoom stays available for accessibility, so no user-scalable=no / maximum-scale here. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- External (not inline) so the CSP can forbid inline scripts. Sets the theme before first paint. -->
    <script src="/theme-init.js"></script>
    <script src="/config.js"></script>
    <!-- Transparent glyph: Safari draws a light plate behind favicons, so a dark tile showed as a ring. Generated by
         scripts/generate_logos.py. sizes="32x32" on the .ico stops Chrome picking it over the SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Kept in sync with the active theme by src/theme.ts -->
    <meta name="theme-color" content="#FBFAF5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111F1A" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Loupebox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Loupebox Feedback</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
