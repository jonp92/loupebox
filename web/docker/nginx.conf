server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx drops inherited add_header lines in any block that sets its own, so every block includes these.
    include /etc/nginx/security-headers.conf;

    # Runtime config written by the entrypoint script; never cache so API_URL changes apply.
    location = /config.js {
        alias /tmp/config.js;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Right MIME type for the PWA manifest; revalidated so updates show up.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # The embeddable widget is an ES module that other sites import. Browsers fetch module scripts with CORS,
    # so any origin must be allowed (the file is public; the site key and origin allow-list protect the API).
    # The URL carries only the major version (/widget/v1/), so it is cached briefly: minor releases reach
    # pages within minutes, and stale-while-revalidate keeps pages working if this server is slow or down.
    location /widget/ {
        include /etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Vite output is content-hashed.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
