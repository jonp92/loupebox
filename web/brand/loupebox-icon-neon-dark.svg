<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" role="img" aria-labelledby="t">
  <title id="t">Loupebox</title>
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="handle-grad" gradientUnits="userSpaceOnUse" x1="157" y1="157" x2="196" y2="196">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#007799"/>
    </linearGradient>
    <radialGradient id="lens-glass">
      <stop offset="0" stop-color="rgb(0,229,255)" stop-opacity="0.1"/>
      <stop offset="1" stop-color="rgb(0,229,255)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="250" height="250" fill="#0B0E14"/>

  <!-- Lens: r 62, ring 9 (15% of r). Lens + handle are centred as one group. -->
  <circle cx="110" cy="110" r="62" fill="url(#lens-glass)"/>
  <circle cx="110" cy="110" r="62" fill="none" stroke="#00E5FF" stroke-width="9" filter="url(#neon-glow)"/>

  <!-- Insight check: legs meet at 90°, bounding box centred on the lens -->
  <polyline points="76.1,110 98.7,132.6 143.9,87.4" fill="none" stroke="#F8F9FA" stroke-width="7.2"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Handle: leaves the ring's outer edge at 45° (r + half the ring) -->
  <line x1="157" y1="157" x2="196" y2="196" stroke="url(#handle-grad)" stroke-width="18" stroke-linecap="round"/>
</svg>
