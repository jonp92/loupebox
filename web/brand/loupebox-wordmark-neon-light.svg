<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t">
  <title id="t">Loupebox</title>
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
      <!-- Softer glow: a full-strength halo smears on a light background -->
      <feComponentTransfer result="blur"><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="handle-grad" gradientUnits="userSpaceOnUse" x1="213.4" y1="155.4" x2="236" y2="178">
      <stop offset="0" stop-color="#00A8CC"/>
      <stop offset="1" stop-color="#005F7A"/>
    </linearGradient>
    <radialGradient id="lens-glass">
      <stop offset="0" stop-color="rgb(0,149,182)" stop-opacity="0.1"/>
      <stop offset="1" stop-color="rgb(0,149,182)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Measured with Montserrat: content spans x 63-758, so scale to 92% about its centre -->
  <g transform="translate(400 125) scale(0.92) translate(-410.6 -125)">
    <!-- Type: 110px, cap height ~77, so baseline 163.5 puts the cap centre on y 125 (the lens centre).
         LOUPE is 800, BOX 500. -->
    <g font-family="Montserrat, system-ui, sans-serif" font-weight="800" font-size="110"
       letter-spacing="0.05em" fill="#11151C" aria-hidden="true">
      <text x="136" y="163.5" text-anchor="end">L</text>
      <text x="243" y="163.5">UPE<tspan font-weight="500">BOX</tspan></text>
    </g>

    <!-- Lens (the O): r 40, ring 6 (15% of r) -->
    <circle cx="183" cy="125" r="40" fill="url(#lens-glass)"/>
    <circle cx="183" cy="125" r="40" fill="none" stroke="#0095B6" stroke-width="6" filter="url(#neon-glow)"/>

    <!-- Insight check: legs meet at 90°, bounding box centred on the lens -->
    <polyline points="161.8,125 175.9,139.1 204.2,110.9" fill="none" stroke="#11151C" stroke-width="4.8"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Handle: leaves the ring's outer edge at 45° (r + half the ring) -->
    <line x1="213.4" y1="155.4" x2="236" y2="178" stroke="url(#handle-grad)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
